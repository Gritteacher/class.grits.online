<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><div id="root"></div>
<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import { RosterPage } from '../src/roster/RosterPage';
import { renameRoom } from '../src/roster/model';
import { emptyState } from '../src/model';
import '../src/styles.css';
function Fixture() {
  const [state, setState] = React.useState({ ...emptyState(), rooms: ['ม.6/1', 'ม.6/2'],
    students: [{ id: 'student', name: 'นักเรียนทดสอบ', code: '00001', number: 1, room: 'ม.6/1', status: 'active' }] });
  return React.createElement(RosterPage, { state, onSave: () => true,
    onRenameRoom: async (previous, name) => {
      const next = renameRoom(state, previous, name);
      await new Promise((resolve) => setTimeout(resolve, 300));
      setState(next);
    } });
}
createRoot(document.getElementById('root')).render(React.createElement(Fixture));
</script></html>
